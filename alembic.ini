[alembic]
# Path to migration scripts, relative to this file
script_location = migrations

# Template for migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Leave sqlalchemy.url blank — env.py reads it from .env at runtime
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
